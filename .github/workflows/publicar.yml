name: Atualizar painel

on:
  push:
    branches: [main]
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"   # a cada ~10 min (o GitHub pode atrasar alguns minutos)
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Montar site
        run: |
          mkdir -p _site/data
          cp index.html logo.png _site/
          v="${GITHUB_SHA::8}"
          sed -i "s/__BUILD__/$v/" _site/index.html
          echo "$v" > _site/data/versao.txt

      - name: Buscar Ibovespa e índices
        continue-on-error: true
        run: node scripts/buscar-indices.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4

      # O GitHub desliga tarefas agendadas após 60 dias sem commits.
      # Este passo faz um commit vazio a cada ~45 dias para manter o painel vivo.
      - name: Manter agendamento ativo
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Manter agendamento ativo"
            git push
          fi
